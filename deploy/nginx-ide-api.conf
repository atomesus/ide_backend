# nginx in front of ide_backend (PM2 on 127.0.0.1:4100). certbot adds the
# HTTPS server block and the http→https redirect to this file.
server {
    listen 80;
    server_name ide-api.atomesus.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Chat completions stream Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
